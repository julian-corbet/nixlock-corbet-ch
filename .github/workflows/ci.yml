name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # A job that hangs must fail on its own clock rather than hold a runner until GitHub's
    # six-hour default gives up. Sized at roughly 3x this job's observed duration; the Rust
    # build dominates it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --all-systems is NOT optional, and is why this spells the command out instead of running
      # a bare `nix flake check`. Without it, only the RUNNER's system is evaluated and every
      # other declared system is skipped with a warning -- then it exits 0. That is a check that
      # passed having tested nothing. `supportedSystems` in flake.nix is deliberately narrowed to
      # x86_64-linux so this can be strict and still be true.
      #
      # --keep-going is the same idea one level down: a red run should report every problem, not
      # one problem per rerun.
      - name: nix flake check (all systems)
        run: nix flake check --all-systems --keep-going --print-build-logs

      # The Nix checks above cover the MODULES. They cannot see the Rust crate at all, and the
      # crate is where the lock screen's actual behaviour lives -- so this step is not redundant
      # with the one above, it is the other half.
      #
      # buildRustPackage's default checkPhase runs `cargo test`, so building the package IS
      # running the suite. Spelled as its own step so a test failure reads as a test failure in
      # the job log rather than as a build error.
      - name: cargo test (in-derivation, via nix build)
        run: nix build .#nixlock --print-build-logs
